<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUBA ABSI | متجر العبايات</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #faf8f5;
  color: #222;
}
header {
  background: #111;
  color: #d4af70;
  text-align: center;
  padding: 30px;
}
header h1 { margin: 0; }
nav {
  text-align: center;
  padding: 15px;
}
.products {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 15px;
  padding: 15px;
}
.product {
  background: white;
  padding: 12px;
  border-radius: 12px;
  text-align: center;
}
.product img {
  width: 100%;
  border-radius: 10px;
}
button {
  background: #111;
  color: #d4af70;
  border: 0;
  padding: 12px;
  border-radius: 8px;
  cursor: pointer;
}
footer {
  text-align: center;
  padding: 25px;
  background: #111;
  color: white;
}
</style>
</head>
<body>

<header>
<h1>RUBA ABSI</h1>
<p>أناقتك تبدأ من هنا</p>
</header>

<nav>
<h2>تشكيلة العبايات</h2>
<p>عبايات شتوية فاخرة – جملة ومفرق</p>
</nav>

<div class="products">
<div class="product">
<h3>عباية شتوية</h3>
<p>السعر: يحدد لاحقاً</p>
<button>اطلبي الآن</button>
</div>
</div>

<footer>
<p>RUBA ABSI</p>
<p>توصيل لجميع المحافظات السورية</p>
<p>الدفع عند الاستلام</p>
</footer>

</body>
</html>
